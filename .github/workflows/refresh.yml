name: Refresh public event calendars
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'lib/**'
      - 'tests/**'
      - 'refresh.mjs'
      - '.github/workflows/refresh.yml'
permissions:
  contents: write
concurrency:
  group: refresh-public-calendars
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test tests/events.test.mjs
      - name: Fetch and validate public listings
        run: node refresh.mjs
      - name: Publish successful sources and freshness status
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feeds status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public event calendars'
            git push
          fi
